<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Темы итогового сочинения</title>
<style>
  :root {
    --bg: #f5ede3;
    --card-bg: #efe3d3;
    --card-border: #d8c6b0;
    --text-dark: #2e2419;
    --text-num: #7a5c3e;
    --text-title: #4a3f35;
    --btn-bg: #e8d9c8;
    --btn-active: #dcc8b3;
    --hint-bg: #e6d6c0;
    --hint-border: #c9b299;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text-dark);
    min-height: 100vh;
  }
  .app {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 22px 130px;
  }
  h1 {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: var(--text-title);
    margin: 10px 0 30px;
  }
  .card {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 6px;
    padding: 18px 22px;
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 6px 0;
  }
  .num {
    font-family: Consolas, "Courier New", monospace;
    font-weight: bold;
    font-size: 18px;
    color: var(--text-num);
    min-width: 40px;
    text-align: right;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .theme-block {
    flex: 1;
  }
  .theme {
    font-size: 18px;
    line-height: 1.45;
    color: var(--text-dark);
  }
  
  /* Стили нижней панели и кнопок */
  .bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);
    padding: 18px 22px;
    display: flex;
    justify-content: space-between; /* Разносим кнопки по краям */
    max-width: 860px;
    margin: 0 auto;
    z-index: 10;
  }
  
  .refresh-btn, .global-hint-btn {
    font-family: Georgia, serif;
    font-size: 18px;
    font-weight: bold;
    color: var(--text-title);
    background: var(--btn-bg);
    border: none;
    border-radius: 6px;
    padding: 15px 32px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .refresh-btn:hover, .global-hint-btn:hover { background: var(--btn-active); }
  .refresh-btn:active, .global-hint-btn:active { background: var(--btn-active); }

  /* Стили модального окна */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(46, 36, 25, 0.6);
    z-index: 999;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal-window {
    background: var(--bg);
    border: 2px solid var(--card-border);
    border-radius: 8px;
    width: 100%;
    max-width: 700px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--card-border);
    font-size: 20px;
    font-weight: bold;
    color: var(--text-title);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 28px;
    color: var(--text-num);
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text-dark); }

  .modal-content {
    padding: 24px;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.5;
  }
  
  .hint-subtitle {
    font-weight: bold;
    color: var(--text-num);
    margin-top: 12px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="app">
    <h1 style="margin-bottom: 5px;">Темы итогового сочинения</h1>
  <div style="text-align: center; font-family: Georgia, serif; font-style: italic; color: var(--text-num); font-size: 16px; margin-bottom: 30px;">
    (только темы прошлых лет)
  </div>Темы итогового сочинения</h1>
  <div id="cards"></div>
</div>

<div class="bottom">
  <!-- Кнопка "Произведения" слева -->
  <button class="global-hint-btn" onclick="openGlobalHint()">Произведения</button>
  <!-- Кнопка "Обновить" справа -->
  <button class="refresh-btn" onclick="refresh()">Обновить темы</button>
</div>

<!-- Модальное окно для подсказок -->
<div class="modal-overlay" id="hintModal" onclick="closeGlobalHint(event)">
  <div class="modal-window" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>Произведения для аргументации</span>
      <button class="modal-close" onclick="closeGlobalHint(event)">&times;</button>
    </div>
    <div class="modal-content" id="modalContent">
      <!-- Сюда скрипт вставит список -->
    </div>
  </div>
</div>

<script>

// ============================================================
// БАЗА ТЕМ И ПОДСКАЗОК (ПРОИЗВЕДЕНИЯ)
// ============================================================
const THEMES = {
  "1": [
    {t: "Какую жизнь можно считать прожитой не зря?", h: ["М. Горький «Старуха Изергиль» (Данко)", "А.П. Чехов «Ионыч»", "И.А. Бунин «Господин из Сан-Франциско»", "Л.Н. Толстой «Война и мир» (Андрей Болконский)"]},
    {t: "Что важнее: любить или быть любимым?", h: ["А.С. Пушкин «Евгений Онегин»", "И.С. Тургенев «Отцы и дети»", "М.А. Булгаков «Мастер и Маргарита»", "А.И. Куприн «Гранатовый браслет»"]},
    {t: "Чем опасна свобода без ограничений?", h: ["Ф.М. Достоевский «Преступление и наказание»", "М.Ю. Лермонтов «Герой нашего времени»", "У. Голдинг «Повелитель мух»", "А.С. Пушкин «Цыганы»"]},
    {t: "Кого можно считать счастливым человеком?", h: ["Л.Н. Толстой «Война и мир» (Пьер, Наташа)", "А.С. Пушкин «Евгений Онегин»", "И.А. Гончаров «Обломов»", "А.П. Чехов «Крыжовник»"]},
    {t: "Во имя чего человек может идти на самопожертвование?", h: ["М. Горький «Старуха Изергиль» (Данко)", "Л.Н. Толстой «Война и мир»", "В. Быков «Сотников»", "А.И. Куприн «Гранатовый браслет»"]},
    {t: "Чем опасно равнодушие?", h: ["А.П. Чехов «Ионыч»", "М.Ю. Лермонтов «Герой нашего времени» (Печорин)", "К.Г. Паустовский «Телеграмма»", "А.И. Солженицын «Матрёнин двор»"]},
    {t: "Что такое взаимопонимание?", h: ["Л.Н. Толстой «Война и мир»", "И.С. Тургенев «Отцы и дети»", "А.С. Пушкин «Капитанская дочка»", "Ф.М. Достоевский «Преступление и наказание»"]},
    {t: "«Я люблю, и значит – я живу…» (В. С. Высоцкий)", h: ["А.И. Куприн «Гранатовый браслет»", "М.А. Булгаков «Мастер и Маргарита»", "А.С. Пушкин «Евгений Онегин»", "И.А. Бунин «Тёмные аллеи»"]},
    {t: "Как Вы понимаете, что такое «честь» и «бесчестие»?", h: ["А.С. Пушкин «Капитанская дочка»", "М.Ю. Лермонтов «Песня про купца Калашникова»", "Н.В. Гоголь «Тарас Бульба»", "А.К. Толстой «Князь Серебряный»"]},
    {t: "Как Вы понимаете, что такое «нравственный закон»?", h: ["Ф.М. Достоевский «Преступление и наказание»", "Л.Н. Толстой «Война и мир»", "А.И. Солженицын «Матрёнин двор»", "В. Распутин «Уроки французского»"]},
    {t: "Как Вы понимаете слово «долг»?", h: ["А.С. Пушкин «Капитанская дочка»", "Л.Н. Толстой «Война и мир»", "Н.В. Гоголь «Тарас Бульба»", "В. Быков «Сотников»"]},
    {t: "Что такое справедливость и милосердие?", h: ["Ф.М. Достоевский «Преступление и наказание»", "А.И. Куприн «Чудесный доктор»", "Л.Н. Толстой «Война и мир»", "А.П. Чехов «Крыжовник»"]},
    {t: "Дружба в жизни человека.", h: ["А.С. Пушкин «Евгений Онегин»", "И.А. Гончаров «Обломов»", "Л.Н. Толстой «Война и мир»", "В.Г. Короленко «В дурном обществе»"]},
    {t: "Почему многие писатели говорили об очистительной силе страдания?", h: ["Ф.М. Достоевский «Преступление и наказание»", "М.А. Булгаков «Мастер и Маргарита»", "А.И. Солженицын «Матрёнин двор»", "Л.Н. Толстой «Война и мир»"]},
    {t: "Можно ли обойтись в жизни без творчества?", h: ["М.А. Булгаков «Мастер и Маргарита»", "А.П. Чехов «Чайка»", "Н.В. Гоголь «Портрет»", "Б.Л. Пастернак «Доктор Живаго»"]},
    {t: "Ради чего стоит жить?", h: ["М. Горький «Старуха Изергиль»", "Л.Н. Толстой «Война и мир»", "А.П. Чехов «Ионыч»", "И.А. Бунин «Господин из Сан-Франциско»"]},
    {t: "Какие человеческие качества для Вас наиболее ценны?", h: ["А.С. Пушкин «Капитанская дочка»", "Л.Н. Толстой «Война и мир»", "В. Распутин «Уроки французского»", "А.И. Солженицын «Матрёнин двор»"]},
    {t: "Почему человек решается идти наперекор судьбе?", h: ["М.Ю. Лермонтов «Герой нашего времени»", "А.С. Пушкин «Евгений Онегин»", "М. Горький «Старуха Изергиль»", "Ф.М. Достоевский «Преступление и наказание»"]},
    {t: "Грех и раскаяние в жизни человека.", h: ["Ф.М. Достоевский «Преступление и наказание»", "А.С. Пушкин «Капитанская дочка» (Пугачёв)", "М.А. Булгаков «Мастер и Маргарита»", "Л.Н. Толстой «Воскресение»"]},
    {t: "Трудно или легко делать добро?", h: ["А.И. Куприн «Чудесный доктор»", "А.И. Солженицын «Матрёнин двор»", "В. Распутин «Уроки французского»", "М.А. Шолохов «Судьба человека»"]},

    {t: "Может ли любовь нести человеку несчастье?", h: ["А.И. Куприн «Гранатовый браслет»", "А.С. Пушкин «Евгений Онегин»", "И.А. Бунин «Тёмные аллеи»", "М.Ю. Лермонтов «Герой нашего времени»"]},
    {t: "Как Вы понимаете утверждение Н.А. Заболоцкого: «Душа обязана трудиться»?", h: ["А.П. Чехов «Ионыч»", "М.А. Булгаков «Мастер и Маргарита»", "Л.Н. Толстой «Война и мир»", "А.И. Солженицын «Матрёнин двор»"]},
    {t: "Понимать человека или управлять им?", h: ["М.Ю. Лермонтов «Герой нашего времени»", "Ф.М. Достоевский «Преступление и наказание»", "А.П. Чехов «Человек в футляре»", "М.А. Булгаков «Собачье сердце»"]},
    {t: "Можно ли жить без цели?", h: ["А.П. Чехов «Ионыч»", "И.А. Гончаров «Обломов»", "И.А. Бунин «Господин из Сан-Франциско»", "М.Ю. Лермонтов «Герой нашего времени»"]},

    {t: "Зачем человеку заглядывать в будущее?", h: ["М.А. Булгаков «Мастер и Маргарита»", "А.П. Чехов «Вишнёвый сад»", "Е.И. Замятин «Мы»", "А.П. Платонов «Котлован»"]},

// ЛОГИКА

const SECTION_KEYS = Object.keys(THEMES).sort();
const THEMES_PER_SECTION = 2;

const NUMBERED = {};
let counter = 1;
for (const key of SECTION_KEYS) {
  NUMBERED[key] = THEMES[key].map(item => [counter++, item.t, item.h]);
}

function sample(arr, k) {
  const copy = arr.slice();
  const out = [];
  k = Math.min(k, copy.length);
  for (let i = 0; i < k; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    out.push(copy.splice(idx, 1)[0]);
  }
  return out;
}

function generateSelection() {
  const result = [];
  for (const key of SECTION_KEYS) {
    result.push(...sample(NUMBERED[key], THEMES_PER_SECTION));
  }
  return result;
}

let lastSelection = [];

function sameSelection(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i][0] !== b[i][0]) return false;
  }
  return true;
}

function refresh() {
  let selection = generateSelection();
  let tries = 0;
  while (sameSelection(selection, lastSelection) && tries < 10) {
    selection = generateSelection();
    tries++;
  }
  lastSelection = selection;

  const cards = document.getElementById("cards");
  cards.innerHTML = "";

  for (let i = 0; i < selection.length; i += THEMES_PER_SECTION) {
    const pair = selection.slice(i, i + THEMES_PER_SECTION);
    const card = document.createElement("div");
    card.className = "card";

    for (const [num, text] of pair) {
      const row = document.createElement("div");
      row.className = "row";

      const numDiv = document.createElement("div");
      numDiv.className = "num";
      numDiv.textContent = num;

      const block = document.createElement("div");
      block.className = "theme-block";

      const themeDiv = document.createElement("div");
      themeDiv.className = "theme";
      themeDiv.textContent = text;

      block.appendChild(themeDiv);
      row.appendChild(numDiv);
      row.appendChild(block);
      card.appendChild(row);
    }
    
    // В самих карточках теперь только темы, без кнопок
    cards.appendChild(card);
  }
}

function openGlobalHint() {
  const modal = document.getElementById("hintModal");
  const content = document.getElementById("modalContent");
  content.innerHTML = ""; // Очищаем

  // Проходимся по последней выпавшей выборке
  for (let i = 0; i < lastSelection.length; i += THEMES_PER_SECTION) {
    const pair = lastSelection.slice(i, i + THEMES_PER_SECTION);
    
    // Блок для одной карточки (двух тем)
    const section = document.createElement("div");
    section.style.marginBottom = "24px";
    section.style.paddingBottom = "16px";
    section.style.borderBottom = "1px dashed var(--card-border)";

    for (const [num, text, hints] of pair) {
      const subTitle = document.createElement("div");
      subTitle.className = "hint-subtitle";
      subTitle.textContent = num + ". " + text;
      section.appendChild(subTitle);

      const ul = document.createElement("ul");
      for (const h of hints) {
        const li = document.createElement("li");
        li.textContent = h;
        ul.appendChild(li);
      }
      section.appendChild(ul);
    }
    content.appendChild(section);
  }

  // Убираем линию у последнего блока
  const lastChild = content.lastElementChild;
  if (lastChild) {
    lastChild.style.borderBottom = "none";
    lastChild.style.marginBottom = "0";
    lastChild.style.paddingBottom = "0";
  }

  modal.classList.add("open");
}

function closeGlobalHint(e) {
  if (!e || e.target.classList.contains("modal-overlay") || e.target.classList.contains("modal-close")) {
    document.getElementById("hintModal").classList.remove("open");
  }
}

refresh();
